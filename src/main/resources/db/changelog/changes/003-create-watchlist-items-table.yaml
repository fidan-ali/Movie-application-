databaseChangeLog:
  - changeSet:
      id: 3-create-watchlist-items
      author: fidan
      changes:
        - createTable:
            tableName: watchlist_items
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: watchlist_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: tmdb_movie_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: vote_average
                  type: DOUBLE PRECISION

              - column:
                  name: added_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: watchlist_items
            baseColumnNames: watchlist_id
            referencedTableName: watchlists
            referencedColumnNames: id
            constraintName: fk_watchlist_items_watchlist