databaseChangeLog:
        - changeSet:
                  id: 1
                  author: fidan
                  changes:
                          - createTable:
                                    tableName: users
                                    columns:
                                            - column:
                                                      name: id
                                                      type: BIGSERIAL
                                                      constraints:
                                                              primaryKey: true
                                                              nullable: false
                                            - column:
                                                      name: first_name
                                                      type: VARCHAR(255)
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: last_name
                                                      type: VARCHAR(255)
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: email
                                                      type: VARCHAR(255)
                                                      constraints:
                                                              nullable: false
                                                              unique: true
                                            - column:
                                                      name: birth_date
                                                      type: DATE
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: created_at
                                                      type: TIMESTAMP
                                                      constraints:
                                                              nullable: false

        - changeSet:
                  id: 2
                  author: fidan
                  changes:
                          - createTable:
                                    tableName: watchlists
                                    columns:
                                            - column:
                                                      name: id
                                                      type: BIGSERIAL
                                                      constraints:
                                                              primaryKey: true
                                                              nullable: false
                                            - column:
                                                      name: user_id
                                                      type: BIGINT
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: name
                                                      type: VARCHAR(255)
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: created_at
                                                      type: TIMESTAMP
                                                      constraints:
                                                              nullable: false
                          - addForeignKeyConstraint:
                                    baseTableName: watchlists
                                    baseColumnNames: user_id
                                    constraintName: fk_watchlists_user
                                    referencedTableName: users
                                    referencedColumnNames: id
                                    onDelete: CASCADE

        - changeSet:
                  id: 3
                  author: fidan
                  changes:
                          - createTable:
                                    tableName: watchlist_items
                                    columns:
                                            - column:
                                                      name: id
                                                      type: BIGSERIAL
                                                      constraints:
                                                              primaryKey: true
                                                              nullable: false
                                            - column:
                                                      name: watchlist_id
                                                      type: BIGINT
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: tmdb_movie_id
                                                      type: BIGINT
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: title
                                                      type: VARCHAR(255)
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: vote_average
                                                      type: DOUBLE PRECISION
                                            - column:
                                                      name: added_at
                                                      type: TIMESTAMP
                                                      constraints:
                                                              nullable: false
                          - addForeignKeyConstraint:
                                    baseTableName: watchlist_items
                                    baseColumnNames: watchlist_id
                                    constraintName: fk_watchlist_items_watchlist
                                    referencedTableName: watchlists
                                    referencedColumnNames: id
                                    onDelete: CASCADE

        - changeSet:
                  id: 4
                  author: fidan
                  changes:
                          - createTable:
                                    tableName: watchlist_item_genres
                                    columns:
                                            - column:
                                                      name: watchlist_item_id
                                                      type: BIGINT
                                                      constraints:
                                                              nullable: false
                                            - column:
                                                      name: genre_name
                                                      type: VARCHAR(255)
                          - addForeignKeyConstraint:
                                    baseTableName: watchlist_item_genres
                                    baseColumnNames: watchlist_item_id
                                    constraintName: fk_watchlist_item_genres_item
                                    referencedTableName: watchlist_items
                                    referencedColumnNames: id
                                    onDelete: CASCADE